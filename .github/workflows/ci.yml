name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Smoke test built bundle against the mock server
        run: |
          MOCK_PORT=5099 MOCK_SIMULATE_SECONDS=0 npm run mock &
          for i in $(seq 1 30); do curl -sf http://localhost:5099/api/v1/system/info >/dev/null && break; sleep 1; done
          curl -sf http://localhost:5099/ | grep -q '<div id="app">'
          curl -sf http://localhost:5099/config.json | grep -q origin
          curl -sf http://localhost:5099/api/v1/system/info | grep -q '"realtime"'
          kill %1
      - uses: actions/upload-artifact@v4
        with:
          name: 007resort-kds-dist
          path: dist/
          retention-days: 7

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
